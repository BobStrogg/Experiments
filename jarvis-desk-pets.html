<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis Desk Pets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600&display=swap">
<style>
/* Layout: a single column: header, mood bar, then a responsive grid of pet cards. */
:root {
  --bg: #eef3fb; --surface: #ffffff; --fg: #0f1b33; --muted: #5a6a86; --line: #d6e0ef;
  --accent: #2563eb; --accent-ink: #ffffff; --floor: #dbe4f2;
  --font-display: "Fredoka", "Nunito Sans", ui-rounded, system-ui, sans-serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1322; --surface: #131c30; --fg: #e5ecf8; --muted: #94a4c1; --line: #263452;
  --accent: #5b8cff; --accent-ink: #0c1322; --floor: #1b2740; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0c1322; --surface: #131c30; --fg: #e5ecf8; --muted: #94a4c1; --line: #263452;
  --accent: #5b8cff; --accent-ink: #0c1322; --floor: #1b2740; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; padding-inline: 16px; padding-block: 28px 56px; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 22px; }
.eyebrow { font: 600 12px/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
h1 { font: 600 clamp(28px, 4.5vw, 40px)/1.1 var(--font-display); margin: 6px 0 0; text-wrap: balance; }
p { margin: 0; max-width: 65ch; }
.muted { color: var(--muted); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; }
button.mood { font: 600 13.5px/1 var(--font-body); padding: 9px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
button.mood:hover { border-color: var(--accent); }
button.mood[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 720px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 14px 16px; display: grid; gap: 4px; min-width: 0; }
.stage { position: relative; height: 150px; border-radius: 12px; overflow: hidden; background: linear-gradient(to top, var(--floor) 0 14px, transparent 14px); }
.pet { position: absolute; bottom: 14px; left: 0; width: 120px; cursor: pointer; will-change: transform; }
.card b { font: 600 17px/1.2 var(--font-display); margin-top: 6px; }
.card span { font-size: 13px; color: var(--muted); }
.new { font: 700 10.5px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 999px; padding: 3px 7px; margin-left: 6px; vertical-align: 2px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Jarvis desk pets</div>
    <h1>Meet the pets</h1>
    <p class="muted">Six vector pets, drawn and animated by the same code Jarvis uses (UI kit 0.16). Click a pet to say hello, or try a mood on all of them.</p>
  </header>
  <div class="bar" role="group" aria-label="Moods">
    <button class="mood" data-mood="" aria-pressed="true">Wandering</button>
    <button class="mood" data-mood="working" aria-pressed="false">Agent working</button>
    <button class="mood" data-mood="done" aria-pressed="false">Agent finished</button>
    <button class="mood" data-mood="error" aria-pressed="false">Agent failed</button>
    <button class="mood" data-mood="notify" aria-pressed="false">New in Inbox</button>
    <button class="mood" data-mood="sleep" aria-pressed="false">Nap</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

  const dark = () => { const t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches; };
  const grid = document.getElementById("grid");
  let globalMood = "";
  const pets = P.DESK_PET_CHARACTERS.map((c, i) => {
    const card = document.createElement("div"); card.className = "card";
    card.innerHTML = `<div class="stage"><div class="pet"></div></div><b>${c.name}${NEW.has(c.id) ? '<span class="new">New</span>' : ""}</b><span>${c.tagline}</span>`;
    grid.appendChild(card);
    const host = card.querySelector(".pet"); host.innerHTML = P.rigMarkup(c.id, "g" + i);
    const parts = {}; host.querySelectorAll("[data-part]").forEach((el) => { const n = el.getAttribute("data-part"); if (!parts[n]) parts[n] = el; });
    const st = { id: c.id, host, parts, stage: card.querySelector(".stage"), x: 40 + i * 9, target: 80, facing: 1, action: "idle", t: 0, wait: 1 + i * 0.4, heart: 0, hop: 0, face: "", arm: P.createArm(), y: 0, vy: 0 };
    host.addEventListener("click", () => { st.heart = 1.6; if (st.y === 0) st.vy = -260; });
    return st;
  });
  document.querySelectorAll("button.mood").forEach((b) => b.addEventListener("click", () => {
    globalMood = b.dataset.mood;
    document.querySelectorAll("button.mood").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    if (globalMood === "done" || globalMood === "notify") pets.forEach((p) => { if (p.y === 0) p.vy = -300; });
  }));
  let clock = 0, last = 0;
  function frame(now) {
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 0; last = now; if (!reduce) clock += dt;
    const isDark = dark(); const legs = P.legColours(isDark);
    for (const p of pets) {
      const w = p.stage.clientWidth - 120;
      const mood = globalMood === "sleep" ? null : globalMood || null;
      const resting = globalMood === "sleep" || globalMood === "working" || globalMood === "error";
      if (!reduce) {
        p.t += dt; p.heart = Math.max(0, p.heart - dt);
        if (p.vy || p.y < 0) { p.vy += 1500 * dt; p.y += p.vy * dt; if (p.y >= 0) { p.y = 0; p.vy = 0; p.action = "land"; p.t = 0; } else p.action = p.vy < 0 ? "jump" : "fall"; }
        else if (resting) { p.action = globalMood === "sleep" ? "sleep" : globalMood === "error" ? "idle" : "sit"; }
        else if (p.action === "walk") { const d = p.target - p.x; if (Math.abs(d) < 1) { p.action = "idle"; p.t = 0; p.wait = 1 + Math.random() * 2.5; } else { p.facing = d < 0 ? -1 : 1; p.x += Math.sign(d) * Math.min(Math.abs(d), 46 * dt); } }
        else if (p.action === "land" && p.t > 0.18) { p.action = "idle"; p.t = 0; }
        else if ((p.action === "idle" || p.action === "sit" || p.action === "sleep") && p.t > p.wait) { p.action = "walk"; p.t = 0; p.target = Math.random() * Math.max(10, w); }
        else if (p.action === "sit" || p.action === "sleep") { p.action = "idle"; p.t = 0; }
      }
      const armAngle = P.stepArm(p.arm, dt, P.armModeFor(p.action, mood), clock);
      const pose = P.computePose(p.id, { action: p.action, time: p.t, clock, mood, heart: p.heart > 0, facing: p.facing, armAngle, rising: p.vy < 0 });
      const key = pose.eyes + pose.mouth;
      if (key !== p.face) { p.parts.eyes.innerHTML = P.eyesMarkup(P.RIGS[p.id].face, pose.eyes); p.parts.mouth.innerHTML = P.mouthMarkup(P.RIGS[p.id].face, pose.mouth); p.face = key; }
      p.parts["eye-pair"] = p.host.querySelector('[data-part="eye-pair"]');
      for (const [k, v] of Object.entries(pose.transforms)) { const el = p.parts[k]; if (el) v ? el.setAttribute("transform", v) : el.removeAttribute("transform"); }
      for (const [k, v] of Object.entries(pose.opacity)) { const el = p.parts[k]; if (el) el.setAttribute("opacity", v); }
      p.parts.overlay.innerHTML = P.overlayMarkup(P.overlayAnchors(p.id, p.facing), pose.overlay, clock);
      p.host.querySelectorAll('[data-part="led"], [data-part="beacon"]').forEach((el) => el.setAttribute("fill", el.getAttribute(pose.led ? "data-on" : "data-off")));
      for (const [k, v] of Object.entries(legs)) p.host.style.setProperty(k, v);
      p.host.style.transform = `translate(${Math.round(p.x)}px, ${Math.round(p.y)}px)`;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
